<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第1步：学会用SD/ComfyUI生成单张动漫图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      padding: 32px;
      line-height: 1.6;
    }
    h2 { color: #ffffff; font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .roadmap {
      margin-top: 24px;
      padding: 20px;
      background: #1a1a2e;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }
    .roadmap h3 { margin: 0 0 16px 0; color: #667eea; font-size: 18px; }
    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }
    .step-num {
      background: #667eea;
      color: white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .step-text { color: #ccc; font-size: 15px; }
  </style>
</head>
<body>

  <h2>第1步：学会用SD/ComfyUI生成单张动漫图</h2>
  <p class="subtitle">从零开始，理解AI绘图的基础</p>

  <div class="roadmap">
    <h3>本步学习路线</h3>
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">理解Stable Diffusion是什么、怎么工作的</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">了解SD的界面选择：WebUI vs ComfyUI</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">理解核心概念：Checkpoint、VAE、Sampler、CFG</div>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <div class="step-text">学会写Prompt（提示词）</div>
    </div>
    <div class="step">
      <div class="step-num">5</div>
      <div class="step-text">动手生成第一张动漫图</div>
    </div>
  </div>

</body>
</html>
